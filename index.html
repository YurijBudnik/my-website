<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>My Artist</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <div class="logo">My Artist <span>Pianist</span></div>

  <nav>
    <ul>
  <li data-en="Biography" data-ua="Біографія">Biography</li>
  <li data-en="Concerts" data-ua="Концерти">Concerts</li>
  <li data-en="Media" data-ua="Медіа">Media</li>
  <li data-en="Albums" data-ua="Альбоми">Albums</li>
  <li data-en="News" data-ua="Новини">News</li>
  <li data-en="Contact" data-ua="Контакти">Contact</li>
</ul>

<button onclick="switchLang()">UA / EN</button>
  </nav>
</header>

<section class="hero">
  <h1></h1>
</section>
<script>
window.addEventListener("scroll", function() {
  const header = document.querySelector(".header");

  if (window.scrollY > 50) {
    header.classList.add("scrolled");
  } else {
    header.classList.remove("scrolled");
  }
});
</script>
</body>
</html>
