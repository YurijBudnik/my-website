<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yurij Budnik | Accordionist</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">

  <!-- ЛОГО -->
  <a href="index.html" class="logo-container">
    <span class="logo-main" data-en="Yurij Budnik" data-ua="Юрій Буднік">Yurij Budnik</span>
    <span class="logo-sub" data-en="Accordionist" data-ua="Акордеоніст">Accordionist</span>
  </a>

  <!-- БУРГЕР -->
  <button id="burger" class="burger">☰</button>

  <!-- МЕНЮ -->
  <div class="nav-wrapper" id="menu">

    <div class="lang-switch">
      <button onclick="setLang('ua')">UA</button> /
      <button onclick="setLang('en')">EN</button>
    </div>

    <nav>
      <ul>
        <li><a href="#" class="nav-link" data-en="Biography" data-ua="Біографія">Biography</a></li>
        <li><a href="#" class="nav-link" data-en="Concerts" data-ua="Концерти">Concerts</a></li>
        <li><a href="#" class="nav-link" data-en="Media" data-ua="Медіа">Media</a></li>
        <li><a href="#" class="nav-link" data-en="Albums" data-ua="Альбоми">Albums</a></li>
        <li><a href="#" class="nav-link" data-en="News" data-ua="Новини">News</a></li>
        <li><a href="#" class="nav-link" data-en="Contact" data-ua="Контакти">Contact</a></li>
      </ul>
    </nav>

  </div>
</header>

<section class="hero"></section>

<section class="news">
  <h2 data-en="Latest News" data-ua="Останні новини">Latest News</h2>
</section>

<script>
const burger = document.getElementById("burger");
const menu = document.getElementById("menu");

burger.addEventListener("click", () => {
  menu.classList.toggle("open");
});

// Мова
function setLang(lang) {
  document.querySelectorAll("[data-en]").forEach(el => {
    el.textContent = el.dataset[lang];
  });

  localStorage.setItem("lang", lang);
}

// Завантаження мови
const savedLang = localStorage.getItem("lang") || "ua";
setLang(savedLang);
</script>

</body>
</html>
