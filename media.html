<!-- LIGHTBOX -->
<div id="lightbox" class="fixed inset-0 bg-black/90 hidden items-center justify-center z-50">

  <button onclick="closeLightbox()" class="absolute top-5 right-5 text-white text-3xl">×</button>

  <button id="prevBtn" class="absolute left-5 text-white/60 hover:text-white text-4xl">‹</button>

  <div class="flex flex-col items-center">
    <img id="lightbox-img" class="max-h-[80vh] object-contain">
    <p id="counter" class="text-white/70 text-sm mt-4"></p>
  </div>

  <button id="nextBtn" class="absolute right-5 text-white/60 hover:text-white text-4xl">›</button>

</div>

<!-- SCRIPT -->
<script>
const images = Array.from(document.querySelectorAll('.gallery-img'));
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightbox-img');
const counter = document.getElementById('counter');

let currentIndex = 0;

images.forEach((img, index) => {
  img.addEventListener('click', () => {
    currentIndex = index;
    lightbox.style.display = 'flex';
    updateImage();
  });
});

function updateImage() {
  lightboxImg.src = images[currentIndex].src;
  counter.textContent = `${currentIndex + 1} / ${images.length}`;
}

function closeLightbox() {
  lightbox.style.display = 'none';
}

function nextImage() {
  currentIndex = (currentIndex + 1) % images.length;
  updateImage();
}

function prevImage() {
  currentIndex = (currentIndex - 1 + images.length) % images.length;
  updateImage();
}

document.getElementById('nextBtn').onclick = nextImage;
document.getElementById('prevBtn').onclick = prevImage;

// keyboard
document.addEventListener('keydown', (e) => {
  if (lightbox.style.display !== 'flex') return;
  if (e.key === 'ArrowRight') nextImage();
  if (e.key === 'ArrowLeft') prevImage();
  if (e.key === 'Escape') closeLightbox();
});

// swipe
let startY = 0;

lightbox.addEventListener('touchstart', e => {
  startY = e.touches[0].clientY;
});

lightbox.addEventListener('touchend', e => {
  let endY = e.changedTouches[0].clientY;
  let diff = startY - endY;

  if (diff > 50) nextImage();
  if (diff < -50) prevImage();
});
</script>

</body>
