<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Yurij Budnik</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <div class="logo">Yurij Budnik <span>Accordionist</span></div>

  <nav>
    <ul>
  <li data-en="Biography" data-ua="Біографія">Biography</li>
  <li data-en="Concerts" data-ua="Концерти">Concerts</li>
  <li data-en="Media" data-ua="Медіа">Media</li>
  <li data-en="Albums" data-ua="Альбоми">Albums</li>
  <li data-en="News" data-ua="Новини">News</li>
  <li data-en="Contact" data-ua="Контакти">Contact</li>
</ul>

<button onclick="switchLang()">UA / EN</button>
  </nav>
</header>

<section class="hero">
  <h1></h1>
</section>
<script>
let currentLang = "en";

function switchLang() {
  const items = document.querySelectorAll("nav li");

  currentLang = currentLang === "en" ? "ua" : "en";

  items.forEach(item => {
    item.textContent = item.dataset[currentLang];
  });
}
</script>
</body>
</html>
