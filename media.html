<!DOCTYPE html>
<html lang="uk" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">

  <style>
    .gallery-img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      cursor: pointer;
      transition: transform 0.5s ease, opacity 0.4s ease;
    }

    .gallery-img:hover {
      transform: scale(1.05);
      opacity: 0.9;
    }

    .offset {
      transform: translateY(20%);
    }
  </style>
</head>

<body class="bg-white text-gray-900 font-serif antialiased overflow-y-scroll">

  <div id="header-bar" class="responsive-header-bar w-full px-4 sm:px-6 md:px-8 lg:px-10 flex items-center justify-between gap-4">
      
    <div class="w-full flex items-baseline justify-between gap-4">

    <a href="index.html" id="logo-link" class="logo-container min-w-0 flex items-baseline gap-2 text-2xl sm:text-3xl lg:text-4xl">
      <span id="logo-text" class="responsive-logo-text tracking-normal text-gray-900 leading-none" data-en="Yurij Budnik" data-ua="Юрій Буднік">
        Yurij Budnik
      </span>
    
      <span class="responsive-sub-text tracking-normal hidden lg:inline text-gray-700 leading-none">
        <span class="main-letter" data-en="A" data-ua="А">A</span><span class="responsive-sub-text-lowercase" data-en="ccordionist" data-ua="кордеоніст">ccordionist</span>
      </span>
    </a>  
    
      <nav id="desktop-nav" class="hidden md:flex items-baseline space-x-5 lg:space-x-7 flex-shrink-0">

        <!-- Biography -->
        <a href="biography.html" class="nav-link tracking-normal group relative text-base lg:text-lg font-light text-gray-700 hover:text-black transition-colors leading-none" data-en="Biography" data-ua="Біографія">
          <span>Біографія</span>
          <span class="absolute -bottom-1 left-0 w-0 h-[1px] bg-black transition-all duration-200 ease-out group-hover:w-full"></span>
        </a>

        <!-- Concerts -->
        <a href="concerts.html" class="nav-link tracking-normal group relative text-base lg:text-lg font-light text-gray-700 hover:text-black transition-colors leading-none" data-en="Concerts" data-ua="Концерти">
          <span>Концерти</span>
          <span class="absolute -bottom-1 left-0 w-0 h-[1px] bg-black transition-all duration-200 ease-out group-hover:w-full"></span>
        </a>

        <!-- ACTIVE -->
        <a href="media.html" class="nav-link tracking-normal group relative text-base lg:text-lg font-light text-black leading-none" data-en="Media" data-ua="Медіа">
          <span>Медіа</span>
          <span class="absolute -bottom-1 left-0 w-full h-[1px] bg-black"></span>
        </a>

        <!-- Contact -->
        <a href="index.html#contact" class="nav-link tracking-normal group relative text-base lg:text-lg font-light text-gray-700 hover:text-black transition-colors leading-none" data-en="Contact" data-ua="Контакти">
          <span>Контакти</span>
          <span class="absolute -bottom-1 left-0 w-0 h-[1px] bg-black transition-all duration-200 ease-out group-hover:w-full"></span>
        </a>

        <!-- LANG -->
        <div class="ml-1 pl-3 border-l border-gray-200 flex items-baseline space-x-1 text-[12px] font-sans text-gray-400 leading-none">
          <button id="desk-btn-ua" onclick="setLang(event,'ua')" class="hover:text-gray-700 transition-colors px-0.5">UA</button>
          <span class="text-gray-300 select-none scale-75">|</span>
          <button id="desk-btn-en" onclick="setLang(event,'en')" class="hover:text-gray-700 transition-colors px-0.5">EN</button>
        </div>

      </nav>
    </div>

    <button id="mobile-menu-btn" class="md:hidden p-1.5">☰</button>
  </div>
</header>

<!-- ================= CONTENT ================= -->
<main class="pt-24">

  <!-- TITLE -->
  <section class="text-center py-12">
    <h1 class="text-2xl sm:text-3xl lg:text-4xl font-serif font-extralight tracking-wide text-gray-900 mb-6 border-b border-gray-100 pb-3"
        data-en="Media"
        data-ua="Галерея">
      Галерея
    </h1>
  </section>

  <!-- GRID -->
  <section class="max-w-6xl mx-auto grid grid-cols-2 md:grid-cols-4 gap-y-12 gap-x-8 px-6">

    <div><img src="images/media/1.jpg" class="gallery-img"></div>
    <div class="offset"><img src="images/media/2.jpg" class="gallery-img"></div>
    <div><img src="images/media/3.jpg" class="gallery-img"></div>
    <div class="offset"><img src="images/media/4.jpg" class="gallery-img"></div>

    <div class="offset"><img src="images/media/5.jpg" class="gallery-img"></div>
    <div><img src="images/media/6.jpg" class="gallery-img"></div>
    <div class="offset"><img src="images/media/7.jpg" class="gallery-img"></div>
    <div><img src="images/media/8.jpg" class="gallery-img"></div>

    <div><img src="images/media/9.jpg" class="gallery-img"></div>
    <div class="offset"><img src="images/media/10.jpg" class="gallery-img"></div>
    <div><img src="images/media/11.jpg" class="gallery-img"></div>
    <div class="offset"><img src="images/media/12.jpg" class="gallery-img"></div>

    <div class="offset"><img src="images/media/13.jpg" class="gallery-img"></div>
    <div><img src="images/media/14.jpg" class="gallery-img"></div>

  </section>

</main>

<!-- LIGHTBOX -->
<div id="lightbox" class="fixed inset-0 bg-black/90 hidden items-center justify-center z-50">

  <button onclick="closeLightbox()" class="absolute top-5 right-5 text-white text-3xl">×</button>

  <button id="prevBtn" class="absolute left-5 text-white/60 hover:text-white text-4xl">‹</button>

  <div class="flex flex-col items-center">
    <img id="lightbox-img" class="max-h-[80vh] object-contain transition-all duration-500 scale-95 opacity-0">
    <p id="counter" class="text-white/70 text-sm mt-4"></p>
  </div>

  <button id="nextBtn" class="absolute right-5 text-white/60 hover:text-white text-4xl">›</button>

</div>

<!-- SCRIPT -->
<script>
const images = Array.from(document.querySelectorAll('.gallery-img'));
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightbox-img');
const counter = document.getElementById('counter');

let currentIndex = 0;

images.forEach((img, index) => {
  img.addEventListener('click', () => {
    currentIndex = index;
    lightbox.style.display = 'flex';
    updateImage();
  });
});

function updateImage() {
  lightboxImg.style.opacity = 0;
  lightboxImg.style.transform = "scale(0.95)";

  setTimeout(() => {
    lightboxImg.src = images[currentIndex].src;
    counter.textContent = `${currentIndex + 1} / ${images.length}`;
    lightboxImg.style.opacity = 1;
    lightboxImg.style.transform = "scale(1)";
  }, 100);
}

function closeLightbox() {
  lightbox.style.display = 'none';
}

function nextImage() {
  currentIndex = (currentIndex + 1) % images.length;
  updateImage();
}

function prevImage() {
  currentIndex = (currentIndex - 1 + images.length) % images.length;
  updateImage();
}

document.getElementById('nextBtn').onclick = nextImage;
document.getElementById('prevBtn').onclick = prevImage;

// keyboard
document.addEventListener('keydown', (e) => {
  if (lightbox.style.display !== 'flex') return;
  if (e.key === 'ArrowRight') nextImage();
  if (e.key === 'ArrowLeft') prevImage();
  if (e.key === 'Escape') closeLightbox();
});

// swipe
let startY = 0;

lightbox.addEventListener('touchstart', e => {
  startY = e.touches[0].clientY;
});

lightbox.addEventListener('touchend', e => {
  let endY = e.changedTouches[0].clientY;
  let diff = startY - endY;

  if (diff > 50) nextImage();
  if (diff < -50) prevImage();
});
</script>

</body>
</html>
