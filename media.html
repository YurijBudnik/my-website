<!DOCTYPE html>
<html lang="uk" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body class="bg-white text-gray-900 font-serif antialiased overflow-y-scroll">

<!-- ================= HEADER (твій, без змін) ================= -->
<header class="sticky top-0 z-40 w-full bg-white/95 backdrop-blur-md border-b border-gray-100">

  <div id="header-bar" class="responsive-header-bar w-full px-4 sm:px-6 md:px-8 lg:px-10 flex items-center justify-between gap-4">

    <div class="w-full flex items-baseline justify-between gap-4">

      <a href="index.html" id="logo-link" class="logo-container min-w-0 flex items-baseline gap-2 text-2xl sm:text-3xl lg:text-4xl">
        <span id="logo-text" class="responsive-logo-text text-gray-900" data-en="Yurij Budnik" data-ua="Юрій Буднік">
          Yurij Budnik
        </span>

        <span class="responsive-sub-text hidden lg:inline text-gray-700">
          <span data-en="A" data-ua="А">A</span><span data-en="ccordionist" data-ua="кордеоніст">ccordionist</span>
        </span>
      </a>

      <nav id="desktop-nav" class="hidden md:flex items-baseline space-x-5 lg:space-x-7">

        <a href="biography.html" class="nav-link text-gray-700" data-en="Biography" data-ua="Біографія"><span>Біографія</span></a>
        <a href="concerts.html" class="nav-link text-gray-700" data-en="Concerts" data-ua="Концерти"><span>Концерти</span></a>

        <!-- ACTIVE -->
        <a href="media.html" class="nav-link text-black font-medium" data-en="Media" data-ua="Медіа">
          <span>Медіа</span>
        </a>

        <a href="#contact" class="nav-link text-gray-700" data-en="Contact" data-ua="Контакти"><span>Контакти</span></a>

        <div class="ml-1 pl-3 border-l border-gray-200 flex items-baseline space-x-1 text-[12px]">
          <button onclick="setLang(event,'ua')">UA</button>
          <span>|</span>
          <button onclick="setLang(event,'en')">EN</button>
        </div>

      </nav>
    </div>

    <button id="mobile-menu-btn" class="md:hidden p-2">☰</button>
  </div>
</header>

<!-- ================= CONTENT ================= -->
<main class="pt-20">

  <!-- TITLE -->
  <section class="text-center py-10">
    <h1 class="text-2xl font-serif tracking-wide"
        data-en="Media"
        data-ua="Галерея">
      Галерея
    </h1>
  </section>

  <!-- ===== DESKTOP GRID ===== -->
  <section class="hidden md:grid grid-cols-4 gap-6 px-10">

    <img src="images/media/1.jpg" class="gallery-img" loading="lazy">
    <img src="images/media/2.jpg" class="gallery-img mt-6" loading="lazy">
    <img src="images/media/3.jpg" class="gallery-img" loading="lazy">
    <img src="images/media/4.jpg" class="gallery-img mt-6" loading="lazy">
    <img src="images/media/5.jpg" class="gallery-img" loading="lazy">
    <img src="images/media/6.jpg" class="gallery-img mt-6" loading="lazy">
    <img src="images/media/7.jpg" class="gallery-img" loading="lazy">
    <img src="images/media/8.jpg" class="gallery-img mt-6" loading="lazy">
    <img src="images/media/9.jpg" class="gallery-img" loading="lazy">
    <img src="images/media/10.jpg" class="gallery-img mt-6" loading="lazy">
    <img src="images/media/11.jpg" class="gallery-img" loading="lazy">
    <img src="images/media/12.jpg" class="gallery-img mt-6" loading="lazy">
    <img src="images/media/13.jpg" class="gallery-img" loading="lazy">
    <img src="images/media/14.jpg" class="gallery-img mt-6" loading="lazy">
    <img src="images/media/15.jpg" class="gallery-img" loading="lazy">
    <img src="images/media/16.jpg" class="gallery-img mt-6" loading="lazy">

  </section>

  <!-- ===== MOBILE SWIPE ===== -->
  <section class="md:hidden overflow-x-auto snap-x snap-mandatory">

    <div class="flex">

      <div class="min-w-full snap-center p-4">
        <img src="images/media/1.jpg" class="w-full rounded" loading="lazy">
        <p class="text-sm mt-2">Фото 1</p>
      </div>

      <div class="min-w-full snap-center p-4">
        <img src="images/media/2.jpg" class="w-full rounded" loading="lazy">
        <p class="text-sm mt-2">Фото 2</p>
      </div>

    </div>

  </section>

</main>

<!-- ================= LIGHTBOX ================= -->
<div id="lightbox" class="fixed inset-0 bg-black/90 hidden items-center justify-center z-50">

  <button onclick="closeLightbox()" class="absolute top-5 right-5 text-white text-3xl">×</button>

  <img id="lightbox-img" class="max-h-[80vh]">

</div>

<!-- ================= SCRIPT ================= -->
<script>
const images = document.querySelectorAll('.gallery-img');
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightbox-img');

images.forEach(img => {
  img.addEventListener('click', () => {
    lightbox.style.display = 'flex';
    lightboxImg.src = img.src;
  });
});

function closeLightbox() {
  lightbox.style.display = 'none';
}

// LANGUAGE
function setLang(event, lang) {
  if(event) event.preventDefault();

  document.querySelectorAll('[data-en]').forEach(el => {
    el.textContent = el.dataset[lang];
  });

  localStorage.setItem("lang", lang);
}

const saved = localStorage.getItem("lang") || "ua";
setLang(null, saved);
</script>

</body>
</html>
