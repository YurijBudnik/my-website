<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>My Artist</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <div class="logo">My Artist <span>Pianist</span></div>

  <nav>
    <ul>
      <li>Biography</li>
      <li>Concerts</li>
      <li>Media</li>
      <li>Albums</li>
      <li>News</li>
      <li>Contact</li>
    </ul>
  </nav>
</header>

<section class="hero">
  <h1></h1>
</section>
<script>
window.addEventListener("scroll", function() {
  const header = document.querySelector(".header");

  if (window.scrollY > 50) {
    header.classList.add("scrolled");
  } else {
    header.classList.remove("scrolled");
  }
});
</script>
</body>
</html>
