<!DOCTYPE html>
<html lang="uk" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yurij Budnik | Accordionist</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body class="bg-white text-gray-900 font-serif antialiased overflow-y-scroll">

  <!-- === HEADER (Шапка) === -->
  <header class="sticky top-0 z-40 w-full bg-white/95 backdrop-blur-md border-b border-gray-100 transition-all duration-300 ease-in-out">
    
    <!-- Верхній рядок шапки -->
    <div id="header-bar" class="responsive-header-bar w-full px-4 sm:px-6 md:px-8 lg:px-10 flex items-center justify-between gap-4">
        
      <!-- Внутрішній блок для десктопу/планшета з вирівнюванням по базовій лінії літер -->
      <div class="w-full flex items-baseline justify-between gap-4">

      <!-- Брендинг / Логотип -->
      <a href="#" id="logo-link" class="logo-container min-w-0 flex items-baseline gap-2 text-2xl sm:text-3xl lg:text-4xl">
        <!-- Ім'я / Логотип -->
        <span id="logo-text" class="responsive-logo-text tracking-normal text-gray-900 leading-none" data-en="Yurij Budnik" data-ua="Юрій Буднік">
          Yurij Budnik
        </span>
      
        <!-- Підзаголовок зі збереженням структури літер -->
        <span class="responsive-sub-text tracking-normal hidden lg:inline text-gray-700 leading-none">
          <span class="main-letter" data-en="A" data-ua="А">A</span><span class="responsive-sub-text-lowercase" data-en="ccordionist" data-ua="кордеоніст">ccordionist</span>
        </span>
      </a>  
      
        <!-- Десктопне та планшетне меню -->
        <nav id="desktop-nav" class="hidden md:flex items-baseline space-x-5 lg:space-x-7 flex-shrink-0">
          <a href="biography.html" class="nav-link tracking-normal group relative text-base lg:text-lg font-light text-gray-700 hover:text-black transition-colors leading-none" data-en="Biography" data-ua="Біографія">
            <span>Біографія</span>
            <span class="absolute -bottom-1 left-0 w-0 h-[1px] bg-black transition-all duration-200 ease-out group-hover:w-full"></span>
          </a>
          <a href="concerts.html" class="nav-link tracking-normal group relative text-base lg:text-lg font-light text-gray-700 hover:text-black transition-colors leading-none" data-en="Concerts" data-ua="Концерти">
            <span>Концерти</span>
            <span class="absolute -bottom-1 left-0 w-0 h-[1px] bg-black transition-all duration-200 ease-out group-hover:w-full"></span>
          </a>
          <a href="media.html" class="nav-link tracking-normal group relative text-base lg:text-lg font-light text-gray-700 hover:text-black transition-colors leading-none" data-en="Media" data-ua="Медіа">
            <span>Медіа</span>
            <span class="absolute -bottom-1 left-0 w-0 h-[1px] bg-black transition-all duration-200 ease-out group-hover:w-full"></span>
          </a>
          <a href="#contact" class="nav-link tracking-normal group relative text-base lg:text-lg font-light text-gray-700 hover:text-black transition-colors leading-none" data-en="Contact" data-ua="Контакти">
            <span>Контакти</span>
            <span class="absolute -bottom-1 left-0 w-0 h-[1px] bg-black transition-all duration-200 ease-out group-hover:w-full"></span>
          </a>

          <!-- Мовний перемикач -->
          <div class="ml-1 pl-3 border-l border-gray-200 flex items-baseline space-x-1 text-[12px] font-sans text-gray-400 leading-none">
            <button id="desk-btn-ua" onclick="setLang(event, 'ua')" class="hover:text-gray-700 transition-colors px-0.5">UA</button>
            <span class="text-gray-300 select-none scale-75">|</span>
            <button id="desk-btn-en" onclick="setLang(event, 'en')" class="hover:text-gray-700 transition-colors px-0.5">EN</button>
          </div>
        </nav>

      </div>

      <!-- Кнопка бургер-меню для мобільних пристроїв -->
      <button id="mobile-menu-btn" aria-label="Toggle Menu" class="md:hidden p-1.5 text-gray-900 hover:text-black focus:outline-none z-50 flex-shrink-0 self-center ml-[3px]">
        <svg class="w-6 h-6 transition-transform duration-300 ease-in-out" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path id="line-top" class="transition-all duration-300 ease-in-out origin-center" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16" />
          <path id="line-mid" class="transition-all duration-300 ease-in-out origin-center" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 12h16" />
          <path id="line-bot" class="transition-all duration-300 ease-in-out origin-center" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 18h16" />
        </svg>
      </button>

    </div>

    <!-- Мобільне випадаюче меню -->
    <div id="mobile-menu" class="mobile-menu-grid md:hidden">
      <div class="mobile-menu-inner flex flex-col justify-between px-6 pb-6 pt-2">
        
        <nav class="flex flex-col space-y-4 text-right">
          <a href="biography.html" class="nav-link text-xl font-serif font-light text-gray-700 hover:text-black transition-colors" data-en="Biography" data-ua="Біографія">Біографія</a>
          <a href="concerts.html" class="nav-link text-xl font-serif font-light text-gray-700 hover:text-black transition-colors" data-en="Concerts" data-ua="Концерти">Концерти</a>
          <a href="media.html" class="nav-link text-xl font-serif font-light text-gray-700 hover:text-black transition-colors" data-en="Media" data-ua="Медіа">Медіа</a>
          <a href="#contact" class="nav-link text-xl font-serif font-light text-gray-700 hover:text-black transition-colors" data-en="Contact" data-ua="Контакти">Контакти</a>
        </nav>

        <!-- Мобільний мовний перемикач -->
        <div class="mt-6 flex justify-end items-center space-x-1 text-[12px] text-gray-400 font-sans">
          <button id="btn-ua" onclick="setLang(event, 'ua')" class="hover:text-gray-700 transition-colors px-0.5">UA</button>
          <span class="text-gray-300 select-none scale-75">|</span>
          <button id="btn-en" onclick="setLang(event, 'en')" class="hover:text-gray-700 transition-colors px-0.5">EN</button>
        </div>

      </div>
    </div>
  </header>

<!-- TITLE -->
<section class="page-title">
  <h1 data-en="Media" data-ua="Медіа">Media</h1>
</section>

<!-- GALLERY -->
<section class="gallery">

  <img src="images/media/1.jpg" onclick="openModal(1)">
  <img src="images/media/2.jpg" onclick="openModal(2)">
  <img src="images/media/3.jpg" onclick="openModal(3)">
  <img src="images/media/4.jpg" onclick="openModal(4)">
  <img src="images/media/5.jpg" onclick="openModal(5)">
  <img src="images/media/6.jpg" onclick="openModal(6)">
  <img src="images/media/7.jpg" onclick="openModal(7)">
  <img src="images/media/8.jpg" onclick="openModal(8)">
  <img src="images/media/9.jpg" onclick="openModal(9)">
  <img src="images/media/10.jpg" onclick="openModal(10)">
  <img src="images/media/11.jpg" onclick="openModal(11)">
  <img src="images/media/12.jpg" onclick="openModal(12)">
  <img src="images/media/13.jpg" onclick="openModal(13)">
  <img src="images/media/14.jpg" onclick="openModal(14)">
  <img src="images/media/15.jpg" onclick="openModal(15)">
  <img src="images/media/16.jpg" onclick="openModal(16)">

</section>

<!-- MODAL -->
<div id="modal" class="modal">

  <span class="close" onclick="closeModal()">×</span>

  <img id="modal-img">

  <div class="counter" id="counter"></div>

  <div class="arrow left" onclick="prev()">‹</div>
  <div class="arrow right" onclick="next()">›</div>

</div>

<script>
const images = [
  "images/media/1.jpg",
  "images/media/2.jpg",
  "images/media/3.jpg",
  "images/media/4.jpg",
  "images/media/5.jpg",
  "images/media/6.jpg",
  "images/media/7.jpg",
  "images/media/8.jpg"
];

let current = 0;

function openModal(index) {
  current = index;
  document.getElementById("modal").style.display = "flex";
  update();
}

function closeModal() {
  document.getElementById("modal").style.display = "none";
}

function update() {
  document.getElementById("modal-img").src = images[current];
  document.getElementById("counter").innerText =
    (current + 1) + " / " + images.length;
}

function next() {
  current = (current + 1) % images.length;
  update();
}

function prev() {
  current = (current - 1 + images.length) % images.length;
  update();
}
</script>

</body>
</html>
